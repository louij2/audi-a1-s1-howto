<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How SimosTools reaches the S1</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · SimosTools on the S1</p>
    <h1>How SimosTools reaches the S1</h1>

        <div class="diagram-container">
      <svg viewBox="0 0 960 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="simostools-link-title simostools-link-desc">
        <title id="simostools-link-title">How SimosTools reaches the S1</title>
        <desc id="simostools-link-desc">SimosTools on the phone talks over Bluetooth LE to an ESP32 bridge dongle, which turns it into ISO-TP on the car's CAN bus through the OBD socket, reaching the Simos 18.1 engine ECU for mode 22 logging and the gen 5 Haldex for its DIDs.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone -->
        <rect x="472" y="80" width="448" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="484" y="84" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="536" y="93" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">THE CAR · CAN BUS</text>

        <!-- Arrows (behind nodes) -->
        <line x1="184" y1="208" x2="224" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="408" y1="208" x2="488" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M616,192 H648 Q656,192 656,184 V152 Q656,144 664,144 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M616,224 H648 Q656,224 656,232 V264 Q656,272 664,272 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <g font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em" fill="#5a6580">
          <rect x="190" y="188" width="28" height="12" rx="2" fill="#f5f5f5"/>
          <text x="204" y="197">BLE</text>
          <rect x="426" y="188" width="44" height="12" rx="2" fill="#f5f5f5"/>
          <text x="448" y="197">ISO-TP</text>
          <rect x="664" y="162" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="688" y="171">MODE 22</text>
          <rect x="664" y="242" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="688" y="251">DIDS</text>
        </g>

        <!-- Nodes -->
        <g font-family="'Geist', system-ui, sans-serif" text-anchor="middle">
          <!-- Phone -->
          <rect x="40" y="176" width="144" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="40" y="176" width="144" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <text x="112" y="206" fill="#2d3142" font-size="12" font-weight="600">SimosTools</text>
          <text x="112" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">app on your phone</text>

          <!-- Dongle (focal) -->
          <rect x="224" y="176" width="184" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="224" y="176" width="184" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
          <text x="316" y="206" fill="#2d3142" font-size="12" font-weight="600">Bridge dongle</text>
          <text x="316" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">ESP32 · BLE to ISO-TP</text>

          <!-- OBD socket -->
          <rect x="488" y="176" width="128" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="488" y="176" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="552" y="206" fill="#2d3142" font-size="12" font-weight="600">OBD socket</text>
          <text x="552" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">dongle plugs in</text>

          <!-- Engine ECU -->
          <rect x="720" y="112" width="184" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="720" y="112" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="812" y="138" fill="#2d3142" font-size="12" font-weight="600">Engine ECU</text>
          <text x="812" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Simos 18.1</text>
          <text x="812" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">8 PIDs per request</text>

          <!-- Haldex -->
          <rect x="720" y="240" width="184" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="720" y="240" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="812" y="266" fill="#2d3142" font-size="12" font-weight="600">Haldex gen 5</text>
          <text x="812" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">0x2BF0, 0x2BF1</text>
          <text x="812" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">0x2BE6, 0x2BE7, 0x2BE9</text>
        </g>

        <!-- Callout -->
        <text x="40" y="296" fill="#bf4520" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">“No ECU reply”? Try another dongle first.</text>

        <!-- Legend -->
        <line x1="40" y1="360" x2="920" y2="360" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <line x1="40" y1="404" x2="68" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="80" y="407" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Request (replies come back the same way)</text>
        <rect x="296" y="398" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="328" y="407" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Suspect it first</text>

      </svg>
    </div>
  </div>
</body>
</html>
