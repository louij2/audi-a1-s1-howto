<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How the pieces fit</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · OpenHaldex and S1 Dash</p>
    <h1>How the pieces fit</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="openhaldex-s1-dash-title openhaldex-s1-dash-desc">
        <title id="openhaldex-s1-dash-title">How OpenHaldex-C6 and S1 Dash fit together</title>
        <desc id="openhaldex-s1-dash-desc">OpenHaldex-C6 sits on the Haldex coupling's CAN line and takes mode picks from a phone browser; the S1 Dash app gets Haldex data and switches modes over the OpenHaldex HTTP API, and gets engine data from the car's OBD port through the same BLE bridge dongle SimosTools uses.</desc>

        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M 232,112 H 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>

<rect x="660" y="182" width="56" height="12" rx="2" fill="#f5f5f5"/>

<rect x="272" y="246" width="72" height="12" rx="2" fill="#f5f5f5"/>
<text x="308" y="255" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ENGINE DATA</text>

<rect x="638" y="282" width="28" height="12" rx="2" fill="#f5f5f5"/>

<rect x="40" y="80" width="192" height="64" rx="6" fill="#f5f5f5"/>

<text x="136" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Haldex coupling</text>
<text x="136" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gen 5 on the S1</text>

<text x="136" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OBD port</text>

<rect x="384" y="232" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="384" y="232" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

<rect x="728" y="80" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="728" y="80" width="192" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>

<rect x="728" y="232" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="728" y="232" width="192" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>

<line x1="40" y1="332" x2="920" y2="332" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="360" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="60" y="368" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The two pieces this guide covers</text>
<rect x="240" y="360" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="260" y="368" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The car</text>
<line x1="324" y1="365" x2="352" y2="365" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)" marker-start="url(#arrow-link-start)"/>
<text x="360" y="368" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Browser / HTTP API</text>
<line x1="464" y1="365" x2="492" y2="365" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="500" y="368" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Car data</text>
      </svg>
    </div>
  </div>
</body>
</html>
