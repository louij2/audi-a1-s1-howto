<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boot battery and remote terminals</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · S1 boot battery</p>
    <h1>Boot battery and remote terminals</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="boot-battery-layout-title boot-battery-layout-desc">
        <title id="boot-battery-layout-title">Boot battery and remote terminals</title>
        <desc id="boot-battery-layout-desc">The boot battery's positive post carries fuse holder SA with crash cut-off N253 and feeds an aluminium main lead to the jump-start positive stud in the engine bay; the negative post carries the earth cable with battery monitor J367, and an earth stud sits on the same engine-bay mounting.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g transform="translate(0,-48)">
        <rect x="48" y="104" width="344" height="368" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="60" y="108" width="156" height="12" rx="2" fill="#f5f5f5"/>
        <text x="138" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">BOOT, UNDER THE FLOOR PANEL</text>
        <rect x="568" y="104" width="344" height="368" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="580" y="108" width="184" height="12" rx="2" fill="#f5f5f5"/>
        <text x="672" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ENGINE BAY, AIR CLEANER MOUNTING</text>
        <line x1="220" y1="256" x2="220" y2="216" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="220" y1="320" x2="220" y2="360" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="360" y1="176" x2="600" y2="176" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="360" y1="400" x2="600" y2="400" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="232" y="232" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="241" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">+ POST</text>
        <rect x="232" y="334" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="343" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">− POST</text>
        <rect x="434" y="156" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="165" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ALUMINIUM LEAD</text>
        <rect x="446" y="380" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="389" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BODY EARTH</text>
        <rect x="80" y="136" width="280" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="136" width="280" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="88" y="142" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="104" y="151" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FUSE</text>
        <text x="220" y="175" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Fuse holder SA + N253</text>
        <text x="220" y="191" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">crash cut-off: cuts the main lead</text>
        <text x="220" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">when the airbags fire; sold with SA</text>
        <rect x="80" y="256" width="280" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="256" width="280" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="88" y="262" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="104" y="271" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">12 V</text>
        <text x="220" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Battery</text>
        <text x="220" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">replace like with like</text>
        <rect x="80" y="360" width="280" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="360" width="280" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="88" y="366" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="104" y="375" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
        <text x="220" y="399" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">J367 battery monitor</text>
        <text x="220" y="415" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">on the earth cable at the</text>
        <text x="220" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">negative post (start/stop)</text>
        <rect x="600" y="136" width="280" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="136" width="280" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="608" y="142" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="624" y="151" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">JUMP</text>
        <text x="740" y="175" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Jump-start + stud</text>
        <text x="740" y="191" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">flip-up cover</text>
        <text x="740" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">jump leads and charger here</text>
        <rect x="600" y="360" width="280" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="360" width="280" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="608" y="366" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="624" y="375" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">JUMP</text>
        <text x="740" y="399" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Earth stud</text>
        <text x="740" y="415" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">same mounting</text>
        <text x="740" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">jump leads and charger here</text>
        <text x="740" y="284" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">Charge with the battery connected:</text>
        <text x="740" y="304" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">J367 only counts what flows through it.</text>
        </g>
        <line x1="40" y1="448" x2="920" y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="480" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Crash cut-off N253</text>
        <rect x="192" y="480" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="212" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Battery</text>
        <rect x="288" y="480" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="308" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Part / terminal</text>
        <line x1="424" y1="485" x2="452" y2="485" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="460" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Cable</text>
        <line x1="528" y1="485" x2="556" y2="485" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="564" y="488" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Earth through the body</text>
      </svg>
    </div>
  </div>
</body>
</html>
