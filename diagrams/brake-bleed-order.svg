<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brake-bleed-order-title brake-bleed-order-desc" id="brake-bleed-order-root">
        <title id="brake-bleed-order-title">Brake and clutch bleed order</title>
        <desc id="brake-bleed-order-desc">Bleed order for a brake fluid change on the S1: front left 0.20 l, front right 0.20 l, rear left 0.30 l, rear right 0.30 l, then the clutch slave cylinder 0.15 l because the clutch shares the brake fluid reservoir; 1.15 l in total with the manual gearbox.</desc>
        <defs>
      <style>#brake-bleed-order-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #brake-bleed-order-root { font-family: var(--font-sans); color: var(--color-ink); }
      #brake-bleed-order-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#brake-bleed-order-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="brake-bleed-order-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="brake-bleed-order-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="brake-bleed-order-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <g aria-hidden="true">
          <rect x="80" y="136" width="160" height="48" fill="#2d3142" data-role="rail" data-step="fl" data-index="1" fill-opacity="0.05"/>
          <rect x="240" y="136" width="160" height="48" fill="#2d3142" data-role="rail" data-step="fr" data-index="2" fill-opacity="0.09"/>
          <rect x="400" y="136" width="160" height="48" fill="#2d3142" data-role="rail" data-step="rl" data-index="3" fill-opacity="0.05"/>
          <rect x="560" y="136" width="160" height="48" fill="#2d3142" data-role="rail" data-step="rr" data-index="4" fill-opacity="0.09"/>
          <rect x="720" y="136" width="160" height="48" fill="#bf4520" data-role="rail" data-step="clutch" data-index="5" data-focal="true" fill-opacity="0.08"/>
          <line x1="720" y1="136" x2="880" y2="136" stroke="#bf4520" stroke-width="1"/>
          <line x1="720" y1="184" x2="880" y2="184" stroke="#bf4520" stroke-width="1"/>
        </g>
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" letter-spacing="0.14em" text-anchor="middle">
          <text x="160" y="72" fill="#4f5d75" data-role="number" data-step="fl">01</text><line x1="160" y1="84" x2="160" y2="116" stroke="#bfc0c0"/>
          <text x="320" y="72" fill="#4f5d75" data-role="number" data-step="fr">02</text><line x1="320" y1="84" x2="320" y2="116" stroke="#bfc0c0"/>
          <text x="480" y="72" fill="#4f5d75" data-role="number" data-step="rl">03</text><line x1="480" y1="84" x2="480" y2="116" stroke="#bfc0c0"/>
          <text x="640" y="72" fill="#4f5d75" data-role="number" data-step="rr">04</text><line x1="640" y1="84" x2="640" y2="116" stroke="#bfc0c0"/>
          <text x="800" y="72" fill="#bf4520" data-role="number" data-step="clutch">05</text><line x1="800" y1="84" x2="800" y2="116" stroke="#bf4520"/>
        </g>
        <g aria-hidden="true" fill="#f5f5f5" stroke-width="1">
          <circle cx="160" cy="160" r="36" stroke="#2d3142" data-role="medallion" data-step="fl"/>
          <circle cx="320" cy="160" r="36" stroke="#2d3142" data-role="medallion" data-step="fr"/>
          <circle cx="480" cy="160" r="36" stroke="#2d3142" data-role="medallion" data-step="rl"/>
          <circle cx="640" cy="160" r="36" stroke="#2d3142" data-role="medallion" data-step="rr"/>
          <circle cx="800" cy="160" r="36" fill="#f5f5f5" stroke="none"/><circle cx="800" cy="160" r="36" fill="#bf4520" stroke="#bf4520" data-role="medallion" data-step="clutch" data-focal="true" fill-opacity="0.08"/>
        </g>
        <g font-family="'Geist', system-ui, sans-serif" text-anchor="middle">
          <text x="160" y="165" fill="#2d3142" font-size="14" font-weight="600">0.20 l</text>
          <text x="160" y="228" fill="#2d3142" font-size="12" font-weight="600">Front left</text>
          <text x="160" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">front caliper</text>
          <text x="320" y="165" fill="#2d3142" font-size="14" font-weight="600">0.20 l</text>
          <text x="320" y="228" fill="#2d3142" font-size="12" font-weight="600">Front right</text>
          <text x="320" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">front caliper</text>
          <text x="480" y="165" fill="#2d3142" font-size="14" font-weight="600">0.30 l</text>
          <text x="480" y="228" fill="#2d3142" font-size="12" font-weight="600">Rear left</text>
          <text x="480" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">rear caliper</text>
          <text x="640" y="165" fill="#2d3142" font-size="14" font-weight="600">0.30 l</text>
          <text x="640" y="228" fill="#2d3142" font-size="12" font-weight="600">Rear right</text>
          <text x="640" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">rear caliper</text>
          <text x="800" y="165" fill="#bf4520" font-size="14" font-weight="600">0.15 l</text>
          <text x="800" y="228" fill="#bf4520" font-size="12" font-weight="600">Clutch slave</text>
          <text x="800" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">shares the brake</text>
          <text x="800" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">fluid reservoir</text>
        </g>

        <!-- Legend -->
        <line x1="40" y1="308" x2="920" y2="308" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <circle cx="48" cy="348" r="8" fill="#f5f5f5" stroke="#2d3142"/><text x="64" y="351" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Brake bleed point</text>
        <circle cx="168" cy="348" r="8" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/><text x="184" y="351" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Clutch, bled every change</text>
        <text x="296" y="351" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" font-style="italic">Fluid out per point on a pressure bleeder; two bleeders on one caliper, add them up.</text>
        <text x="920" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="end">Total, manual gearbox: 1.15 l</text>


      </svg>
