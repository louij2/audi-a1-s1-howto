<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="battery-swap-steps-title battery-swap-steps-desc" id="battery-swap-steps-root">
        <title id="battery-swap-steps-title">Disconnecting or replacing the battery</title>
        <desc id="battery-swap-steps-desc">Six steps: fit a like-for-like battery, connect positive first, fit the earth with the J367 plug unplugged and then plug it in, adapt a new battery in address 19, clear the low-voltage faults, and re-teach the windows and set the date in address 17 if needed.</desc>
        <defs>
      <style>#battery-swap-steps-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #battery-swap-steps-root { font-family: var(--font-sans); color: var(--color-ink); }
      #battery-swap-steps-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#battery-swap-steps-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="battery-swap-steps-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="battery-swap-steps-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="battery-swap-steps-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g aria-hidden="true">
          <rect x="48" y="128" width="144" height="48" fill="#2d3142" data-role="rail" data-step="swap" data-index="1" fill-opacity="0.05"/>
          <rect x="192" y="128" width="144" height="48" fill="#2d3142" data-role="rail" data-step="positive" data-index="2" fill-opacity="0.09"/>
          <rect x="336" y="128" width="144" height="48" fill="#bf4520" data-role="rail" data-step="earth" data-index="3" data-focal="true" fill-opacity="0.08"/>
          <line x1="336" y1="128" x2="480" y2="128" stroke="#bf4520" stroke-width="1"/>
          <line x1="336" y1="176" x2="480" y2="176" stroke="#bf4520" stroke-width="1"/>
          <rect x="480" y="128" width="144" height="48" fill="#2d3142" data-role="rail" data-step="adapt" data-index="4" fill-opacity="0.09"/>
          <rect x="624" y="128" width="144" height="48" fill="#2d3142" data-role="rail" data-step="faults" data-index="5" fill-opacity="0.05"/>
          <rect x="768" y="128" width="144" height="48" fill="#2d3142" data-role="rail" data-step="windows" data-index="6" fill-opacity="0.09"/>
        </g>
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600" letter-spacing="0.14em" text-anchor="middle">
          <text x="120" y="64" fill="#4f5d75" data-role="number" data-step="swap">01</text><line x1="120" y1="80" x2="120" y2="116" stroke="#bfc0c0"/>
          <text x="264" y="64" fill="#4f5d75" data-role="number" data-step="positive">02</text><line x1="264" y1="80" x2="264" y2="116" stroke="#bfc0c0"/>
          <text x="408" y="64" fill="#bf4520" data-role="number" data-step="earth">03</text><line x1="408" y1="80" x2="408" y2="116" stroke="#bf4520"/>
          <text x="552" y="64" fill="#4f5d75" data-role="number" data-step="adapt">04</text><line x1="552" y1="80" x2="552" y2="116" stroke="#bfc0c0"/>
          <text x="696" y="64" fill="#4f5d75" data-role="number" data-step="faults">05</text><line x1="696" y1="80" x2="696" y2="116" stroke="#bfc0c0"/>
          <text x="840" y="64" fill="#4f5d75" data-role="number" data-step="windows">06</text><line x1="840" y1="80" x2="840" y2="116" stroke="#bfc0c0"/>
        </g>
        <g aria-hidden="true" fill="#f5f5f5" stroke-width="1">
          <circle cx="120" cy="152" r="36" stroke="#2d3142" data-role="medallion" data-step="swap"/>
          <circle cx="264" cy="152" r="36" stroke="#2d3142" data-role="medallion" data-step="positive"/>
          <circle cx="408" cy="152" r="36" fill="#f5f5f5" stroke="none"/>
          <circle cx="408" cy="152" r="36" fill="#bf4520" stroke="#bf4520" data-role="medallion" data-step="earth" data-focal="true" fill-opacity="0.08"/>
          <circle cx="552" cy="152" r="36" stroke="#2d3142" data-role="medallion" data-step="adapt"/>
          <circle cx="696" cy="152" r="36" stroke="#2d3142" data-role="medallion" data-step="faults"/>
          <circle cx="840" cy="152" r="36" stroke="#2d3142" data-role="medallion" data-step="windows"/>
        </g>
        <g font-family="'Geist', system-ui, sans-serif" text-anchor="middle">
          <text x="120" y="228" fill="#2d3142" font-size="12" font-weight="600">Swap battery</text>
          <text x="120" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">same type as the old,</text>
          <text x="120" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">refit the vent hose</text>
          <text x="264" y="228" fill="#2d3142" font-size="12" font-weight="600">Positive first</text>
          <text x="264" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">clamp the + post</text>
          <text x="264" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">before the earth</text>
          <text x="408" y="228" fill="#bf4520" font-size="12" font-weight="600">Earth, J367 off</text>
          <text x="408" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">unplug J367, earth on,</text>
          <text x="408" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">then plug J367 in</text>
          <text x="552" y="228" fill="#2d3142" font-size="12" font-weight="600">Adapt battery</text>
          <text x="552" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">new battery only:</text>
          <text x="552" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">address 19, Adapt</text>
          <text x="696" y="228" fill="#2d3142" font-size="12" font-weight="600">Clear faults</text>
          <text x="696" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">read all memories,</text>
          <text x="696" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">clear Low voltage</text>
          <text x="840" y="228" fill="#2d3142" font-size="12" font-weight="600">Windows, date</text>
          <text x="840" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">re-teach one-touch,</text>
          <text x="840" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">date in 17 if lost</text>
        </g>
        <line x1="40" y1="316" x2="920" y2="316" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <circle cx="48" cy="353" r="8" fill="#f5f5f5" stroke="#2d3142"/>
        <text x="64" y="356" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Step</text>
        <circle cx="128" cy="353" r="8" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
        <text x="144" y="356" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">The step to get right</text>
        <text x="296" y="356" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" font-style="italic">Order matters when reconnecting: positive, then earth with J367 unplugged.</text>
      </svg>
