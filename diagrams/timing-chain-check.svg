<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="timing-chain-check-title timing-chain-check-desc" id="timing-chain-check-root">
        <title id="timing-chain-check-title">Checking the timing chain for stretch</title>
        <desc id="timing-chain-check-desc">Flowchart of the workshop timing chain check: remove the sealing plug, turn the crank forwards only until the tensioner piston is fully out, then count the teeth showing; six or fewer means the chain is OK (run the chain elongation adaption and clear the fault if one is stored), seven or more means a new chain followed by the adaption, and a new sealing plug goes in every time.</desc>
        <defs>
      <style>#timing-chain-check-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #timing-chain-check-root { font-family: var(--font-sans); color: var(--color-ink); }
      #timing-chain-check-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#timing-chain-check-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="timing-chain-check-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="timing-chain-check-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="timing-chain-check-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (behind nodes) -->
        <line x1="216" y1="76" x2="264" y2="76" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#timing-chain-check-arrow)"/>
        <line x1="456" y1="76" x2="504" y2="76" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#timing-chain-check-arrow)"/>
        <line x1="616" y1="104" x2="616" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#timing-chain-check-arrow)"/>
        <line x1="512" y1="200" x2="396" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#timing-chain-check-arrow)"/>
        <line x1="720" y1="200" x2="784" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#timing-chain-check-arrow)"/>
        <path d="M300,244 V324 Q300,332 308,332 H456" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#timing-chain-check-arrow)"/>
        <path d="M852,228 V324 Q852,332 844,332 H776" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#timing-chain-check-arrow)"/>
        <path d="M204,200 H136 Q128,200 128,208 V420 Q128,428 136,428 H496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#timing-chain-check-arrow)"/>
        <line x1="616" y1="364" x2="616" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#timing-chain-check-arrow)"/>

        <!-- Arrow labels -->
        <g font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em" fill="#5a6580">
          <rect x="420" y="180" width="68" height="12" rx="2" fill="#f5f5f5"/>
          <text x="454" y="189">6 OR FEWER</text>
          <rect x="724" y="180" width="56" height="12" rx="2" fill="#f5f5f5"/>
          <text x="752" y="189">7 OR MORE</text>
          <rect x="308" y="276" width="28" height="12" rx="2" fill="#f5f5f5"/>
          <text x="322" y="285">YES</text>
          <rect x="152" y="180" width="24" height="12" rx="2" fill="#f5f5f5"/>
          <text x="164" y="189">NO</text>
        </g>

        <!-- Nodes -->
        <g font-family="'Geist', system-ui, sans-serif" text-anchor="middle">
          <!-- Start -->
          <rect x="40" y="48" width="176" height="56" rx="20" fill="#f5f5f5"/>
          <rect x="40" y="48" width="176" height="56" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
          <text x="128" y="74" fill="#2d3142" font-size="12" font-weight="600">Chain rattle</text>
          <text x="128" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">or chain fault stored</text>

          <!-- Remove plug -->
          <rect x="264" y="48" width="192" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="264" y="48" width="192" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="360" y="74" fill="#2d3142" font-size="12" font-weight="600">Remove sealing plug</text>
          <text x="360" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">shows tensioner piston</text>

          <!-- Turn crank -->
          <rect x="504" y="48" width="224" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="504" y="48" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="616" y="74" fill="#2d3142" font-size="12" font-weight="600">Turn crank forwards only</text>
          <text x="616" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">24 mm · until piston fully out</text>

          <!-- Count decision (focal) -->
          <polygon points="616,152 720,200 616,248 512,200" fill="#f5f5f5"/>
          <polygon points="616,152 720,200 616,248 512,200" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
          <text x="616" y="198" fill="#2d3142" font-size="12" font-weight="600">Teeth showing</text>
          <text x="616" y="212" fill="#2d3142" font-size="12" font-weight="600">on the piston?</text>

          <!-- Fault stored? -->
          <polygon points="300,156 396,200 300,244 204,200" fill="#f5f5f5"/>
          <polygon points="300,156 396,200 300,244 204,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="300" y="198" fill="#2d3142" font-size="12" font-weight="600">Chain fault</text>
          <text x="300" y="212" fill="#2d3142" font-size="12" font-weight="600">stored?</text>

          <!-- New chain -->
          <rect x="784" y="172" width="136" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="784" y="172" width="136" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="852" y="198" fill="#2d3142" font-size="12" font-weight="600">Fit a new chain</text>
          <text x="852" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">chain is stretched</text>

          <!-- Adaption -->
          <rect x="456" y="300" width="320" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="456" y="300" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="616" y="326" fill="#2d3142" font-size="12" font-weight="600">Chain elongation adaption</text>
          <text x="616" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">guided function · address 01</text>
          <text x="616" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">then clear any stored fault</text>

          <!-- End -->
          <rect x="496" y="404" width="240" height="48" rx="20" fill="#f5f5f5"/>
          <rect x="496" y="404" width="240" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
          <text x="616" y="426" fill="#2d3142" font-size="12" font-weight="600">Fit a new sealing plug</text>
          <text x="616" y="442" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">every time</text>
        </g>

        <!-- Legend -->
        <line x1="40" y1="484" x2="920" y2="484" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
        <rect x="40" y="522" width="24" height="12" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="72" y="531" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Start / end</text>
        <rect x="184" y="522" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="216" y="531" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Step</text>
        <polygon points="300,528 312,522 324,528 312,534" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="332" y="531" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Decision</text>
        <polygon points="420,528 432,522 444,528 432,534" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="452" y="531" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Deciding check</text>

      </svg>
