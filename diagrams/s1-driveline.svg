<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s1-driveline-title s1-driveline-desc" id="s1-driveline-root">
        <title id="s1-driveline-title">S1 quattro driveline and its four oil fills</title>
        <desc id="s1-driveline-desc">Drive runs from the engine and clutch into the 0A8 gearbox, which drives the front wheels and a bevel box; a one-piece propshaft takes drive to the Haldex gen 5 coupling on the 0BR rear diff and on to the rear wheels, with the gearbox, bevel box (0.9 l), coupling (0.70 l at a change) and rear diff (0.95 l) each on their own oil.</desc>
        <defs>
      <style>#s1-driveline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #s1-driveline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #s1-driveline-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#s1-driveline-root .diagram-container { overflow-x: visible; }
}</style>
