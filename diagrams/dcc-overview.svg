<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dcc-overview-title dcc-overview-desc" id="dcc-overview-root">
        <title id="dcc-overview-title">Dynamic Chassis Control on the S1</title>
        <desc id="dcc-overview-desc">J250 takes its inputs over the powertrain CAN bus, with Audi drive select tying in, and sets the current to the four damper valves N336 to N339; the rear left level sender G76 also feeds headlight range control J431.</desc>
        <defs>
      <style>#dcc-overview-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #dcc-overview-root { font-family: var(--font-sans); color: var(--color-ink); }
      #dcc-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#dcc-overview-root .diagram-container { overflow-x: visible; }
}</style>
