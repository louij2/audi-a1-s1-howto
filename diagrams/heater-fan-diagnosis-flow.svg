<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heater-fan-diagnosis-flow-title heater-fan-diagnosis-flow-desc" id="heater-fan-diagnosis-flow-root">
        <title id="heater-fan-diagnosis-flow-title">Heater fan diagnosis, steps 1 to 4</title>
        <desc id="heater-fan-diagnosis-flow-desc">Decision flow: if VCDS shows the specified fan value following the panel but 0 V actual, check the 40 A fuse; if the heated rear window and seats are dead too, suspect terminal X, J59 or the battery; otherwise measure at the motor plug, where 12 V with no spin means motor V2 and no 12 V out of a powered J126 means J126.</desc>
        <defs>
      <style>#heater-fan-diagnosis-flow-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #heater-fan-diagnosis-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #heater-fan-diagnosis-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#heater-fan-diagnosis-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="heater-fan-diagnosis-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="heater-fan-diagnosis-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="heater-fan-diagnosis-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g transform="translate(80,0)">

        <!-- Step eyebrows (left margin) -->
        <g fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="end">
          <text x="196" y="155">STEP 1 · VCDS 08</text>
          <text x="196" y="243">STEP 2</text>
          <text x="196" y="331">STEP 3 · ENGINE ON</text>
          <text x="196" y="439">STEP 4 · GLOVE BOX OUT</text>
        </g>

        <!-- Arrows (behind nodes) -->
        <line x1="320" y1="88" x2="320" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heater-fan-diagnosis-flow-arrow)"/>
        <line x1="424" y1="152" x2="544" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heater-fan-diagnosis-flow-arrow)"/>
        <line x1="320" y1="196" x2="320" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heater-fan-diagnosis-flow-arrow)"/>
        <line x1="320" y1="264" x2="320" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heater-fan-diagnosis-flow-arrow)"/>
        <line x1="424" y1="328" x2="544" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heater-fan-diagnosis-flow-arrow)"/>
        <line x1="320" y1="372" x2="320" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heater-fan-diagnosis-flow-arrow)"/>
        <line x1="424" y1="436" x2="544" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heater-fan-diagnosis-flow-arrow)"/>
        <line x1="320" y1="480" x2="320" y2="500" stroke="#bf4520" stroke-width="1.4" marker-end="url(#heater-fan-diagnosis-flow-arrow-accent)"/>

        <!-- Arrow labels -->
        <g font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">
          <rect x="472" y="132" width="24" height="12" rx="2" fill="#f5f5f5"/>
          <text x="484" y="141" fill="#4f5d75">NO</text>
          <rect x="328" y="200" width="32" height="12" rx="2" fill="#f5f5f5"/>
          <text x="344" y="209" fill="#4f5d75">YES</text>
          <rect x="328" y="268" width="68" height="12" rx="2" fill="#f5f5f5"/>
          <text x="362" y="277" fill="#4f5d75">NOT BLOWN</text>
          <rect x="468" y="308" width="32" height="12" rx="2" fill="#f5f5f5"/>
          <text x="484" y="317" fill="#4f5d75">YES</text>
          <rect x="328" y="376" width="24" height="12" rx="2" fill="#f5f5f5"/>
          <text x="340" y="385" fill="#4f5d75">NO</text>
          <rect x="468" y="416" width="32" height="12" rx="2" fill="#f5f5f5"/>
          <text x="484" y="425" fill="#4f5d75">YES</text>
          <rect x="328" y="484" width="24" height="12" rx="2" fill="#f5f5f5"/>
          <text x="340" y="493" fill="#bf4520">NO</text>
        </g>

        <!-- Start -->
        <rect x="224" y="40" width="192" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="320" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Panel works, no air</text>

        <!-- D1 -->
        <polygon points="320,108 424,152 320,196 216,152" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Specified follows</text>
        <text x="320" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">panel, actual 0 V?</text>

        <!-- End: control side -->
        <rect x="544" y="128" width="192" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="640" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Control side (J255)</text>
        <text x="640" y="165" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">outside this guide</text>

        <!-- Step: fuse -->
        <rect x="224" y="216" width="192" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="237" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Check the 40 A fuse</text>
        <text x="320" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">holder C · black row 2</text>

        <!-- D2 -->
        <polygon points="320,284 424,328 320,372 216,328" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Rear window, seats</text>
        <text x="320" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">dead too?</text>

        <!-- End: terminal X -->
        <rect x="544" y="304" width="192" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="640" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Terminal X / J59</text>
        <text x="640" y="341" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">or battery · VCDS 09</text>

        <!-- D3 -->
        <polygon points="320,392 424,436 320,480 216,436" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">12 V at motor plug</text>
        <text x="320" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">when commanded?</text>

        <!-- End: motor -->
        <rect x="544" y="412" width="192" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="640" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Fan motor V2</text>
        <text x="640" y="449" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">12 V there, no spin</text>

        <!-- End: J126 (focal) -->
        <rect x="224" y="500" width="192" height="48" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="320" y="521" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Final stage J126</text>
        <text x="320" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">12 V in, nothing out</text>

        <!-- Callout -->
        <text x="440" y="528" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">No meter? J126 is the usual failure.</text>
        </g>
      </svg>
