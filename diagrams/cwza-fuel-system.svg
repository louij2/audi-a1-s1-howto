<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cwza-fuel-system-title cwza-fuel-system-desc" id="cwza-fuel-system-root">
        <title id="cwza-fuel-system-title">CWZA fuel system: two pressure sides</title>
        <desc id="cwza-fuel-system-desc">Fuel from the tank delivery unit (pump G6, controlled by J538) splits into a low-pressure feed to the port-injection rail with sender G410 and injectors N532-N535, and a feed to the high-pressure pump with metering valve N290, which supplies the direct-injection rail with sender G247 and injectors N30-N33.</desc>
        <defs>
      <style>#cwza-fuel-system-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #cwza-fuel-system-root { font-family: var(--font-sans); color: var(--color-ink); }
      #cwza-fuel-system-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#cwza-fuel-system-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="cwza-fuel-system-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="cwza-fuel-system-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="cwza-fuel-system-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (drawn first) -->
        <rect x="40" y="176" width="176" height="208" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="52" y="180" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="84" y="189" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">FUEL TANK</text>

        <rect x="264" y="80" width="656" height="312" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="276" y="84" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="300" y="93" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ENGINE</text>

        <!-- Arrows (behind nodes) -->
        <path d="M200,224 H232 Q240,224 240,216 V152 Q240,144 248,144 H536" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cwza-fuel-system-arrow)"/>
        <path d="M200,256 H232 Q240,256 240,264 V328 Q240,336 248,336 H288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cwza-fuel-system-arrow)"/>
        <line x1="448" y1="336" x2="536" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cwza-fuel-system-arrow)"/>
        <line x1="712" y1="144" x2="768" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cwza-fuel-system-arrow)"/>
        <line x1="712" y1="336" x2="768" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cwza-fuel-system-arrow)"/>
        <line x1="128" y1="304" x2="128" y2="272" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#cwza-fuel-system-arrow)"/>

        <!-- Arrow labels -->
        <g font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em" fill="#5a6580">
          <rect x="352" y="124" width="80" height="12" rx="2" fill="#f5f5f5"/>
          <text x="392" y="133">LOW PRESSURE</text>
          <rect x="452" y="316" width="80" height="12" rx="2" fill="#f5f5f5"/>
          <text x="492" y="325">HIGH PRESSURE</text>
          <rect x="136" y="282" width="52" height="12" rx="2" fill="#f5f5f5"/>
          <text x="162" y="291">CONTROLS</text>
        </g>

        <!-- Nodes -->
        <g font-family="'Geist', system-ui, sans-serif" text-anchor="middle">
          <!-- Delivery unit -->
          <rect x="56" y="208" width="144" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="56" y="208" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="128" y="238" fill="#2d3142" font-size="12" font-weight="600">Delivery unit</text>
          <text x="128" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">fuel pump G6</text>

          <!-- J538 -->
          <rect x="56" y="304" width="144" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="56" y="304" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="128" y="328" fill="#2d3142" font-size="12" font-weight="600">Pump control unit</text>
          <text x="128" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">J538 · tank flange</text>

          <!-- Port-injection rail (focal) -->
          <rect x="536" y="112" width="176" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="536" y="112" width="176" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
          <text x="624" y="142" fill="#2d3142" font-size="12" font-weight="600">Port-injection rail</text>
          <text x="624" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">sender G410 · low pressure</text>

          <!-- Port injectors -->
          <rect x="768" y="112" width="136" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="768" y="112" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="836" y="138" fill="#2d3142" font-size="12" font-weight="600">Port injectors</text>
          <text x="836" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">N532-N535</text>
          <text x="836" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one per cylinder</text>

          <!-- High-pressure pump -->
          <rect x="288" y="304" width="160" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="288" y="304" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="368" y="334" fill="#2d3142" font-size="12" font-weight="600">High-pressure pump</text>
          <text x="368" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">metering valve N290</text>

          <!-- Direct-injection rail (focal) -->
          <rect x="536" y="304" width="176" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="536" y="304" width="176" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
          <text x="624" y="334" fill="#2d3142" font-size="12" font-weight="600">Direct-injection rail</text>
          <text x="624" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">sender G247 · high pressure</text>

          <!-- Direct injectors -->
          <rect x="768" y="304" width="136" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="768" y="304" width="136" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="836" y="330" fill="#2d3142" font-size="12" font-weight="600">Direct injectors</text>
          <text x="836" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">N30-N33</text>
          <text x="836" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one per cylinder</text>
        </g>

        <!-- Legend -->
        <line x1="40" y1="424" x2="920" y2="424" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <line x1="40" y1="468" x2="68" y2="468" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cwza-fuel-system-arrow)"/>
        <text x="80" y="471" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Fuel flow</text>
        <line x1="184" y1="468" x2="212" y2="468" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#cwza-fuel-system-arrow)"/>
        <text x="224" y="471" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Electrical control</text>
        <rect x="360" y="462" width="24" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="392" y="471" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Rail with its own pressure sender (G410 low side, G247 high side)</text>

      </svg>
