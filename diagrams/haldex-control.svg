<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="haldex-control-title haldex-control-desc" id="haldex-control-root">
        <title id="haldex-control-title">Haldex gen 5 control: J492, its inputs and its power</title>
        <desc id="haldex-control-desc">J492 gets engine ECU J623 and ABS/ESP J104 data over powertrain CAN through gateway J533, runs pump V181 whose pressure closes the coupling clutch, and is powered from fuse 4 (terminal 30) and fuse 1 (terminal 15) in fuse holder C with its earth at the left C-pillar.</desc>
        <defs>
      <style>#haldex-control-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #haldex-control-root { font-family: var(--font-sans); color: var(--color-ink); }
      #haldex-control-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#haldex-control-root .diagram-container { overflow-x: visible; }
}</style>
