<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heater-fan-chain-title heater-fan-chain-desc" id="heater-fan-chain-root">
        <title id="heater-fan-chain-title">Heater fan chain on a Climatronic A1 / S1</title>
        <desc id="heater-fan-chain-desc">Climatronic J255 asks for a fan speed, the final stage J126 switches the current to fan motor V2, and J126 gets its power from the 40 A fuse through the terminal X / J59 load-shedding feed, which the body control module cuts on a low battery; J126 is marked as the usual failure.</desc>
        <defs>
      <style>#heater-fan-chain-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #heater-fan-chain-root { font-family: var(--font-sans); color: var(--color-ink); }
      #heater-fan-chain-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#heater-fan-chain-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="heater-fan-chain-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="heater-fan-chain-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="heater-fan-chain-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Row eyebrows -->
        <text x="64" y="104" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CONTROL AND FAN</text>
        <text x="64" y="344" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">POWER FEED</text>

        <!-- Arrows (behind nodes) -->
        <line x1="256" y1="152" x2="384" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heater-fan-chain-arrow)"/>
        <line x1="576" y1="152" x2="704" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heater-fan-chain-arrow)"/>
        <line x1="256" y1="392" x2="384" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heater-fan-chain-arrow)"/>
        <line x1="480" y1="360" x2="480" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heater-fan-chain-arrow)"/>
        <line x1="704" y1="392" x2="576" y2="392" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#heater-fan-chain-arrow)"/>

        <!-- Arrow labels -->
        <rect x="276" y="132" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="141" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SPEED REQUEST</text>
        <rect x="596" y="132" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="141" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FAN CURRENT</text>
        <rect x="408" y="266" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="275" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POWER IN</text>
        <rect x="604" y="372" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="381" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SHEDS LOAD</text>

        <!-- Callout -->
        <text x="496" y="224" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">J126 is the usual failure on these cars</text>

        <!-- Node: J255 -->
        <rect x="64" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="120" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="128" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="92" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 1</text>
        <text x="160" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Climatronic J255</text>
        <text x="160" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">asks for a fan speed</text>

        <!-- Node: J126 (focal) -->
        <rect x="384" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="120" width="192" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="392" y="128" width="40" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="412" y="137" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 4</text>
        <text x="480" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Final stage J126</text>
        <text x="480" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">transistor + heat sink</text>

        <!-- Node: V2 -->
        <rect x="704" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="120" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="712" y="128" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="732" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 4</text>
        <text x="800" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Fan motor V2</text>
        <text x="800" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">behind the glove box</text>

        <!-- Node: 40 A fuse -->
        <rect x="64" y="360" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="360" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="368" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="92" y="377" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 2</text>
        <text x="160" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">40 A fuse</text>
        <text x="160" y="414" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">holder C · black row 2</text>

        <!-- Node: Terminal X / J59 -->
        <rect x="384" y="360" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="360" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="392" y="368" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="412" y="377" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 3</text>
        <text x="480" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Terminal X / relay J59</text>
        <text x="480" y="414" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">load-shedding feed (75x)</text>

        <!-- Node: Body control module (external) -->
        <rect x="704" y="360" width="192" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="360" width="192" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="712" y="368" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="732" y="377" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 3</text>
        <text x="800" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Body control module</text>
        <text x="800" y="414" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cuts X on a low battery</text>

        <!-- Legend -->
        <line x1="40" y1="516" x2="920" y2="516" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="556" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="60" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Usual failure</text>
        <line x1="180" y1="561" x2="208" y2="561" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#heater-fan-chain-arrow)"/>
        <text x="216" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Request or power</text>
        <line x1="360" y1="561" x2="388" y2="561" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#heater-fan-chain-arrow)"/>
        <text x="396" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Can cut the feed</text>
        <rect x="540" y="555" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="560" y="564" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STEP n</text>
        <text x="588" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Guide step that checks this part</text>
      </svg>
